      #       --apiKey "$ASC_KEY_ID" \
      #       --apiIssuer "$ASC_ISSUER"

      - name: Skeleton notice
        run: |
          {
            echo "## Mac Desktop skeleton"
            echo ""
            echo "This run produced \`.dist/mac/*.pkg\` but the signing + upload steps are stubbed."
            echo "Wire the TODOs once Apple Developer signing material is in place."
          } >> "$GITHUB_STEP_SUMMARY"
