#
# Build + test + deploy of the JSON endpoint (Bronnoysund.WebApi) to
# Azure Container Apps. Mirrors cd-web.yml — separate workflow so the
# two services roll and roll back independently.

name: CD — WebApi (endpoint to Azure)

on:
  push:
    branches: [master]
    paths:
      - 'Kode/src/Bronnoysund.WebApi/**'
      - 'Kode/src/Bronnoysund.Application/**'
      - 'Kode/src/Bronnoysund.Infrastructure/**'
      - 'Kode/src/Bronnoysund.Infrastructure.Persistence/**'
      - 'Kode/src/Bronnoysund.Domain/**'
      - 'Kode/Directory.Build.props'
      - '.github/workflows/cd-webapi.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RG: bronnoysund-lookup-rg
  ACR: bronnoysundlookup30020
  APP: bronnoysund-webapi
  IMAGE: bronnoysund-webapi
  DOCKERFILE: Kode/src/Bronnoysund.WebApi/Dockerfile
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Kode/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Kode/Bronnoysund.Core.slnf

      - name: Build
        run: dotnet build Kode/Bronnoysund.Core.slnf --no-restore -c Release

      - name: Test
        run: |
          dotnet test Kode/Bronnoysund.Core.slnf \
            --no-build -c Release \
            --logger 'console;verbosity=normal'

  deploy:
    name: Deploy to Container Apps
    needs: [build-and-test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            --file "$DOCKERFILE" \
            Kode

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test + summary
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          sleep 15
          HTTP_CODE="$(curl -fsS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/health" || echo 000)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Smoke test failed: HTTP $HTTP_CODE" >&2
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- **Live**: <https://${FQDN}/health>"
            echo "- **Image**: \`${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
