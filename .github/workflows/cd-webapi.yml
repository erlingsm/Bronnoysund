#
# Deploys the JSON endpoint service (Bronnoysund.WebApi) to Azure Container Apps.
# Same shape as cd-web.yml but a different image, app, and Dockerfile — kept as
# its own workflow so each service is independently deployable and rollback-able.

name: CD — WebApi (endpoint to Azure)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run build+test before deploying'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  RG: bronnoysund-lookup-rg
  ACR: bronnoysundlookup30020
  APP: bronnoysund-webapi
  IMAGE: bronnoysund-webapi
  DOCKERFILE: Kode/src/Bronnoysund.WebApi/Dockerfile

jobs:
  build-and-test:
    name: Build & test
    if: github.event.inputs.run_tests != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test (Core slnf)
        run: dotnet test Kode/Bronnoysund.Core.slnf -c Release

  deploy:
    name: Deploy to Container Apps
    needs: [build-and-test]
    if: always() && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            --file "$DOCKERFILE" \
            Kode

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test + summary
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          sleep 15
          HTTP_CODE="$(curl -fsS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/health" || echo 000)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Smoke test failed: HTTP $HTTP_CODE" >&2
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- **Live**: <https://${FQDN}/health>"
            echo "- **Image**: \`${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
