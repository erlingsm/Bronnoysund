# Bygger og kjører alle .NET-tester på hver push/PR. Ingen secrets nødvendig.

name: Build and Test

on:
  push:
    branches: [master, main]
    paths:
      - 'Kode/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'Kode/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Kode/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore (core solution filter)
        run: dotnet restore Kode/Bronnoysund.Lookup.Core.slnf

      - name: Build (core solution filter)
        run: dotnet build Kode/Bronnoysund.Lookup.Core.slnf --configuration Release --no-restore

      - name: Test (core solution filter)
        run: |
          dotnet test Kode/Bronnoysund.Lookup.Core.slnf \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30

      - name: Test Web solution filter (Speech + RCL + BlazorWeb)
        run: dotnet test Kode/Bronnoysund.Lookup.Web.slnf --configuration Release
