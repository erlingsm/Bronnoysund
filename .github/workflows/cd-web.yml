# SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Commercial
#
# Build + test + deploy of the Blazor Web UI (Bronnoysund.BlazorWeb) to
# Azure Container Apps. Mirrors the MVP pattern: same workflow runs on
# every push and PR, but the deploy job is gated by branch — only `push`
# to master (or a manual workflow_dispatch) actually rolls a new image.
# PR runs stop after the build+test gate.

name: CD — Web (BlazorWeb to Azure)

on:
  push:
    branches: [master]
    paths:
      - 'Kode/src/Bronnoysund.BlazorWeb/**'
      - 'Kode/src/Bronnoysund.Components/**'
      - 'Kode/src/Bronnoysund.ViewModels/**'
      - 'Kode/src/Bronnoysund.Application/**'
      - 'Kode/src/Bronnoysund.Infrastructure/**'
      - 'Kode/src/Bronnoysund.Infrastructure.Persistence/**'
      - 'Kode/src/Bronnoysund.Domain/**'
      - 'Kode/src/Bronnoysund.Speech/**'
      - 'Kode/src/Bronnoysund.Speech.Web/**'
      - 'Kode/Directory.Build.props'
      - '.github/workflows/cd-web.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC token exchange with Azure AD
  contents: read

env:
  RG: bronnoysund-lookup-rg
  ACR: bronnoysundlookup30020
  APP: bronnoysund-web
  IMAGE: bronnoysund-web
  DOCKERFILE: Kode/src/Bronnoysund.BlazorWeb/Dockerfile
  # Opt in to Node.js 24 for JS-based actions now (default from June 2026).
  # Silences the Node.js 20 deprecation notice on checkout / setup-dotnet / azure/login.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Kode/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Kode/Bronnoysund.Web.slnf

      - name: Build
        run: dotnet build Kode/Bronnoysund.Web.slnf --no-restore -c Release

      - name: Test
        run: |
          dotnet test Kode/Bronnoysund.Web.slnf \
            --no-build -c Release \
            --logger 'console;verbosity=normal'

  deploy:
    name: Deploy to Container Apps
    needs: [build-and-test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            --file "$DOCKERFILE" \
            Kode

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test + summary
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          sleep 15
          HTTP_CODE="$(curl -fsS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/" || echo 000)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Smoke test failed: HTTP $HTTP_CODE" >&2
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- **Live**: <https://${FQDN}/>"
            echo "- **Image**: \`${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}\`"
            echo "- **Triggered by**: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
