#
# Deploys the Blazor Web UI (Bronnoysund.BlazorWeb) to Azure Container Apps.
# Separate from cd-webapi.yml so the two services can ship and roll back
# independently. Manual-only by default; flip on the workflow_run block to
# auto-deploy on green CI on master.

name: CD — Web (BlazorWeb to Azure)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run build+test before deploying (defence in depth)'
        type: boolean
        default: true
  # Uncomment to auto-deploy after CI passes on master:
  # workflow_run:
  #   workflows: ['CI']
  #   types: [completed]
  #   branches: [master]

permissions:
  id-token: write   # OIDC token exchange with Azure AD
  contents: read

env:
  RG: bronnoysund-lookup-rg
  ACR: bronnoysundlookup30020
  APP: bronnoysund-web
  IMAGE: bronnoysund-web
  DOCKERFILE: Kode/src/Bronnoysund.BlazorWeb/Dockerfile

jobs:
  build-and-test:
    name: Build & test
    if: github.event.inputs.run_tests != 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test (Web slnf)
        run: dotnet test Kode/Bronnoysund.Web.slnf -c Release

  deploy:
    name: Deploy to Container Apps
    needs: [build-and-test]
    if: always() && (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            --file "$DOCKERFILE" \
            Kode

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}" \
            --query "properties.latestRevisionName" \
            -o tsv

      - name: Smoke test + summary
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          sleep 15
          HTTP_CODE="$(curl -fsS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/" || echo 000)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Smoke test failed: HTTP $HTTP_CODE" >&2
            exit 1
          fi
          {
            echo "## Deployed"
            echo "- **Live**: <https://${FQDN}/>"
            echo "- **Image**: \`${ACR}.azurecr.io/${IMAGE}:${{ github.sha }}\`"
            echo "- **Triggered by**: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
