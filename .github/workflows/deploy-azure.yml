# Bygger Docker-image, pusher til Azure Container Registry, og deployer til Azure Container Apps.
# Kjører kun på push til master/main (ikke PR-er — vi vil ikke deploye fra PR-branch).
#
# Krever følgende GitHub Secrets (sett via 'gh secret set NAVN'):
#   AZURE_CREDENTIALS         JSON fra 'az ad sp create-for-rbac --json-auth ...'
#   AZURE_RESOURCE_GROUP      f.eks. 'bronnoysund-lookup-rg'
#   AZURE_CONTAINER_REGISTRY  f.eks. 'bronnoysundlookup12345' (uten .azurecr.io)
#   AZURE_CONTAINER_APP_NAME  f.eks. 'bronnoysund-webapi'

name: Deploy to Azure Container Apps

on:
  push:
    branches: [master, main]
    paths:
      - 'Kode/src/Bronnoysund.Lookup.WebApi/**'
      - 'Kode/src/Bronnoysund.Lookup.Application/**'
      - 'Kode/src/Bronnoysund.Lookup.Infrastructure/**'
      - 'Kode/src/Bronnoysund.Lookup.Domain/**'
      - 'Kode/Directory.Build.props'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch: {}  # Tillat manuell trigger fra Actions-tab

env:
  IMAGE_NAME: bronnoysund-webapi

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push image (in Azure)
        run: |
          IMAGE_TAG=${{ github.sha }}
          az acr build \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
            --image ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --file Kode/src/Bronnoysund.Lookup.WebApi/Dockerfile \
            Kode/

      - name: Deploy to Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            ACR_LOGIN_SERVER="${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io"
            IMAGE_FULL="${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE_FULL"

      - name: Show deployment URL
        uses: azure/CLI@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            echo "✅ Deployed to: https://${FQDN}"
            echo "## Deployed" >> $GITHUB_STEP_SUMMARY
            echo "Production URL: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
            echo "Image SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          # Vent på rolling update
          sleep 20
          curl -fsS "https://${FQDN}/health" | tee /dev/stderr | grep -q "ok"
