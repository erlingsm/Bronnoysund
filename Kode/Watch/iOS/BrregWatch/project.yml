# xcodegen spec for the BrregWatch watchOS app.
#
# Usage:
#   brew install xcodegen          # one-time
#   cd Kode/Watch/iOS/BrregWatch
#   xcodegen generate              # produces BrregWatch.xcodeproj
#   open BrregWatch.xcodeproj
#
# The .xcodeproj file is gitignored — only this spec + the Swift sources are
# versioned. Run `xcodegen generate` again after editing this file.

name: BrregWatch
options:
  deploymentTarget:
    watchOS: "11.0"
  bundleIdPrefix: com.bronnoysund

targets:
  BrregWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: BrregWatch Watch App
        excludes:
          - Info.plist
    info:
      path: BrregWatch Watch App/Info.plist
      properties:
        CFBundleDisplayName: Brreg
        CFBundleIdentifier: no.roasystemutvikling.bronnoysund.mobile.watchkitapp
        CFBundleName: BrregWatch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: no.roasystemutvikling.bronnoysund.mobile
        NSSpeechRecognitionUsageDescription: "Brreg bruker talegjenkjenning for å la deg slå opp selskaper ved å snakke."
        NSMicrophoneUsageDescription: "Brreg trenger mikrofonen for å fange opp talesøk."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.roasystemutvikling.bronnoysund.mobile.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.10"
    dependencies: []
