# Default values for bronnoysund-lookup.
# Override on `helm install` / `helm upgrade` via --values myvalues.yaml or --set key=value.

image:
  # Pull from the same ACR that Azure Container Apps uses, or any other registry.
  repository: bronnoysundlookup30020.azurecr.io/bronnoysund-webapi
  tag: v4
  pullPolicy: IfNotPresent

# Image pull credentials. When pulling from ACR with admin user enabled, create the secret
# first:  kubectl create secret docker-registry acr-creds \
#           --docker-server=bronnoysundlookup30020.azurecr.io \
#           --docker-username=... --docker-password=...
imagePullSecrets: []
  # - name: acr-creds

replicaCount: 2

# Resource requests/limits per replica.
# Defaults match the Azure Container Apps profile: 0.25 vCPU + 0.5 GiB.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Horizontal Pod Autoscaler. Set enabled: false for a fixed-size deployment.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Service exposes port 80 internally, routed to container port 8080.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress is opt-in; populate for production. Disabled by default so the chart
# can install on clusters that haven't picked an ingress controller yet.
ingress:
  enabled: false
  className: nginx
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  hosts:
    - host: bronnoysund.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: bronnoysund-tls
    #   hosts:
    #     - bronnoysund.example.com

# Application configuration. Anything in here is rendered into a ConfigMap and
# mounted as environment variables. Keep secrets in `secretEnv` instead.
env:
  ASPNETCORE_ENVIRONMENT: Production
  Brreg__BaseUrl: https://data.brreg.no/enhetsregisteret/api/
  Brreg__CacheTtl: "1.00:00:00"
  Brreg__UserAgent: "Bronnoysund.Lookup/0.1 (+https://github.com/erlingsm/Bronnoysund.Lookup)"
  # Container needs a writable DB path. Default uses /tmp (ephemeral).
  # For durable storage, set persistence.enabled below and override this to /data/bronnoysund.db.
  BRONNOYSUND_DB_PATH: /tmp/bronnoysund/bronnoysund.db

# Secret environment variables. Rendered into a Secret and exposed identically to `env`.
# Leave empty for self-contained dev installs; populate for Application Insights / Maskinporten.
secretEnv: {}
  # APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=...;IngestionEndpoint=..."

# Persistent SQLite database. Off by default — replicas use ephemeral storage and the
# cache rebuilds on restart. Turn on for centralised history/favourites.
persistence:
  enabled: false
  storageClass: ""        # empty → cluster's default
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# Probes hit /health which is wired up in WebApi/Program.cs.
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Pod-level settings.
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # SQLite needs write access; keep false unless persistence.enabled with subPath
nodeSelector: {}
tolerations: []
affinity: {}
